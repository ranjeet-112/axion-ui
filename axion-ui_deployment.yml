apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
        - name: axion-ui
          image: ghcr.io/ranjeet-112/axion-ui:a8e5a9a
          imagePullPolicy: Always
          ports:
            - containerPort: 80